repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Mypy runs against the project's venv (managed by uv) so it can see all
  # runtime deps (pydantic, structlog, aiosqlite, typer, etc.). The upstream
  # mirrors-mypy hook creates an isolated env and would need every runtime
  # dep re-declared in additional_dependencies — brittle and duplicative.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (uv run, project venv)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: ["src", "tests"]
