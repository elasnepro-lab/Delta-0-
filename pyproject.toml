[project]
name = "delta0"
version = "0.0.1"
description = "Bot Montage C — portage delta-neutre wstETH / short ETH-PERP (Hyperliquid + Aave v3 Arbitrum)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Eliot", email = "elasne.pro@gmail.com" }]
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "web3>=7.4.0",
    "hyperliquid-python-sdk>=0.9.0",
    "httpx>=0.27.2",
    "aiosqlite>=0.20.0",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
]

[project.scripts]
delta0 = "delta0.main:app"

[dependency-groups]
dev = [
    "ruff>=0.16.5",       # garder en phase avec .pre-commit-config.yaml
    "mypy>=1.13.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.115.0",
    "pre-commit>=4.0.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delta0"]

# --- Ruff ---------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
# The repo root is a source root too: `backtest/` is a top-level package, unlike
# `delta0`, which lives under src/. Without it isort files it as a third party.
src = [".", "src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "N",             # pep8-naming
    "TID",           # tidy imports
    "PL",            # pylint
    "PT",            # pytest style
    "S",             # bandit (security)
    "ASYNC",         # asyncio pitfalls
    "TRY",           # try/except antipatterns
    "RET",           # return statements
]
ignore = [
    "PLR0913",  # too many arguments — config objects are wide
    "PLR0917",  # ditto for positional count — CLI commands carry many options
    "TRY003",   # long messages inside exception class
    "S101",     # asserts allowed in tests (per-file-ignores below)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "S105", "S106", "TID251"]
# The one bot module allowed to touch the Hyperliquid SDK, and operator scripts
# that live outside the bot.
"src/delta0/hl_client.py" = ["TID251"]
"scripts/**/*.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"hyperliquid".msg = "Passer par delta0.hl_client : le SDK signale ses refus par valeur de retour, parfois nichés dans status ok."

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Mypy ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
files = ["src", "tests", "backtest"]

[[tool.mypy.overrides]]
module = ["hyperliquid.*", "eth_account.*", "web3.*"]
ignore_missing_imports = true

# --- Pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=delta0",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=86",
]
markers = [
    "integration: hits live testnet/fork (skipped by default in CI)",
    "slow: takes > 1 second",
]

# --- Coverage -----------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/delta0"]
# Thin SDK/RPC wrappers whose only logic is the call itself. Everything that
# holds a decision, a state machine or an arithmetic step stays in the gate.
# The threshold below is a floor measured on the real perimeter: raise it when
# coverage improves, never lower it to make a run pass.
omit = [
    "src/delta0/main.py",
    "src/delta0/settings.py",
    "src/delta0/venues/aave.py",
    "src/delta0/venues/hyperliquid.py",
    "src/delta0/venues/swap.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
